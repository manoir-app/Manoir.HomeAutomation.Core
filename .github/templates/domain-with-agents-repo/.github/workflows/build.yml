name: build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore {{SOLUTION_FILE}}

      - name: Build
        run: dotnet build {{SOLUTION_FILE}} --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/{{PACKAGE_PREFIX}}.UnitTests/{{PACKAGE_PREFIX}}.UnitTests.csproj --configuration Release --no-build

  ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/{{PACKAGE_PREFIX}}.AdminUi.Front/package-lock.json

      - name: Configure npm registries
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set @manoir-app:registry https://npm.pkg.github.com
          npm config set replace-registry-host never
          npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ui/{{PACKAGE_PREFIX}}.AdminUi.Front
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: ui/{{PACKAGE_PREFIX}}.AdminUi.Front
        run: npm run typecheck

      - name: Build
        working-directory: ui/{{PACKAGE_PREFIX}}.AdminUi.Front
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs:
      - dotnet
      - ui
    strategy:
      matrix:
        include:
          - name: adminui
            image: "{{IMAGE_PREFIX}}-adminui"
            dockerfile: apps/{{PACKAGE_PREFIX}}.AdminUi/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-plugin-catalog:
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # This job is what keeps manoir.plugin.yaml and Manoir.PluginCatalog in sync.
      # Do not remove it: without it, the catalog entry silently drifts from this repo's manifest.
      - name: Publish plugin catalog entry
        id: publish
        uses: manoir-app/manoir-plugin-action@main
        with:
          catalog-repository-url: https://github.com/manoir-app/Manoir.PluginCatalog.git
          catalog-token: ${{ secrets.PLUGIN_CATALOG_TOKEN }}
          manifest-path: manoir.plugin.yaml
          workspace-path: ${{ github.workspace }}
