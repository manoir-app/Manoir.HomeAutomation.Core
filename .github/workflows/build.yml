name: build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MaNoir.HomeAutomation.slnx

      - name: Build
        run: dotnet build MaNoir.HomeAutomation.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/MaNoir.HomeAutomation.UnitTests/MaNoir.HomeAutomation.UnitTests.csproj --configuration Release --no-build

  ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/MaNoir.HomeAutomation.AdminUi.Front/package-lock.json

      - name: Configure npm registries
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set @manoir-app:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ui/MaNoir.HomeAutomation.AdminUi.Front
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: ui/MaNoir.HomeAutomation.AdminUi.Front
        run: npm run typecheck

      - name: Build
        working-directory: ui/MaNoir.HomeAutomation.AdminUi.Front
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: adminui
            image: manoir-homeautomation-adminui
            dockerfile: apps/MaNoir.HomeAutomation.AdminUi/Dockerfile
          - name: sarah
            image: manoir-homeautomation-sarah
            dockerfile: apps/MaNoir.Agents.Sarah/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}