name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  dotnet-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "eng/Versions.props"
          $baseVersion = $props.Project.PropertyGroup.MaNoirVersionPrefix

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          else {
            $parts = $baseVersion.Split('.')

            if ($parts.Length -lt 2) {
              throw "MaNoirVersionPrefix must contain at least major.minor. Current value: $baseVersion"
            }

            $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore MaNoir.Platform.slnx

      - name: Build
        run: dotnet build MaNoir.Platform.slnx --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Run unit tests
        run: dotnet test tests/MaNoir.Core.UnitTests/MaNoir.Core.UnitTests.csproj --configuration Release --no-build

      - name: Pack NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          for project in packages/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build -o artifacts/nuget /p:Version=${{ steps.version.outputs.version }}
          done

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

  dotnet-publish:
    runs-on: ubuntu-latest
    needs:
      - dotnet-pack
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Publish NuGet packages to GitHub Packages
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Validate nuget.org Trusted Publishing configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}" ]; then
            echo "NUGET_TRUSTED_PUBLISHING_USER is not defined."
            echo "Set it to the nuget.org username that created the trust policy, for example: altazion"
            echo "Do not use the package owner organization name unless it is also the policy creator."
            exit 1
          fi

      - name: Authenticate to nuget.org with Trusted Publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish NuGet packages to nuget.org
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

  npm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/MaNoir.Core.AdminUi.Kit/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@manoir-app'

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "eng/Versions.props"
          $baseVersion = $props.Project.PropertyGroup.MaNoirVersionPrefix

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          else {
            $parts = $baseVersion.Split('.')

            if ($parts.Length -lt 2) {
              throw "MaNoirVersionPrefix must contain at least major.minor. Current value: $baseVersion"
            }

            $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        working-directory: ui/MaNoir.Core.AdminUi.Kit
        run: npm ci

      - name: Apply CI version
        working-directory: ui/MaNoir.Core.AdminUi.Kit
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Build npm package
        working-directory: ui/MaNoir.Core.AdminUi.Kit
        run: npm run build

      - name: Create npm artifact directory
        run: mkdir -p artifacts/npm

      - name: Pack npm artifact
        working-directory: ui/MaNoir.Core.AdminUi.Kit
        run: npm pack --pack-destination ../../artifacts/npm

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/npm/*.tgz

      - name: Publish npm package to GitHub Packages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        working-directory: ui/MaNoir.Core.AdminUi.Kit
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@manoir-app/core-admin-ui-kit@${{ steps.version.outputs.version }}" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "npm package version already exists, skipping publish"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-web:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ghcr.io/${{ github.repository_owner }}/manoir-core-adminui:${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "eng/Versions.props"
          $baseVersion = $props.Project.PropertyGroup.MaNoirVersionPrefix

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          else {
            $parts = $baseVersion.Split('.')

            if ($parts.Length -lt 2) {
              throw "MaNoirVersionPrefix must contain at least major.minor. Current value: $baseVersion"
            }

            $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/manoir-core-adminui
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

      - name: Login to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/MaNoir.Core.AdminUi/Dockerfile
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    runs-on: ubuntu-latest
    needs:
      - dotnet-pack
      - dotnet-publish
      - npm-build
      - docker-web
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Download npm artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts/npm

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-v{0}', needs.dotnet-pack.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', needs.dotnet-pack.outputs.version) || format('Build {0}', needs.dotnet-pack.outputs.version) }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          generate_release_notes: true
          body: |
            ${{ github.ref == 'refs/heads/main' && 'Automated main prerelease.' || 'Stable release published from tag.' }}

            Version: ${{ needs.dotnet-pack.outputs.version }}
            Docker image: ${{ needs.docker-web.outputs.image-ref }}
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/npm/*.tgz